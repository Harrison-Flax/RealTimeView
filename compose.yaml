# Referenced from Docker Docs

services:
  server:
    build:
      context: .
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/realtimeview
      - SPRING_DATASOURCE_USERNAME=flax
      - SPRING_DATASOURCE_PASSWORD_FILE=/run/secrets/db-password
      - COINMARKETCAP_API_KEY_FILE=/run/secrets/coinmarketcap-key
      - NEWSAPI_KEY_FILE=/run/secrets/newsapi-key
      - ALPHAVANTAGE_KEY_FILE=/run/secrets/alphavantage-key
    secrets:
      - db-password
      - coinmarketcap-key
      - newsapi-key
      - alphavantage-key

  db:
    image: postgres:18
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=realtimeview
      - POSTGRES_USER=flax
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "flax", "-d", "realtimeview" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

secrets:
  db-password:
    file: db/password.txt
  coinmarketcap-key:
    file: db/coinmarketcap-key.txt
  newsapi-key:
    file: db/newsapi-key.txt
  alphavantage-key:
    file: db/alphavantage-key.txt