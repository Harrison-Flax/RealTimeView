spring.application.name=app

# Database connection (gets overwritten by docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/realtimeview}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flax}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Suppress Warning
spring.jpa.open-in-view=false

# API Keys
alphavantage.api.key=${ALPHAVANTAGE_API_KEY:placeholder}
coinmarketcap.api.key=${COINMARKETCAP_API_KEY:placeholder}
newsapi.api.key=${NEWSAPI_API_KEY:placeholder}
